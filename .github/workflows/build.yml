name: Build and test

# 每次提交都验证：分层依赖、图标一致性、规格与 PRD 同步、脚本可移植性、构建、测试。
# 这些检查都很便宜，但能挡住「加一行 include 破坏可测性」「手改 PRD 被冲掉」
# 「脚本用了 macOS 上不存在的写法」这类要过很久才暴露的问题。
#
# 注意一个覆盖盲区：构建与测试只在 Ubuntu 上跑，而仓库还声称支持 macOS 与
# Windows（Git Bash）。因此 macOS/Windows 特有的问题**不会**在这里暴露，
# 只能靠 check_shell.py 这类静态护栏兜住。新增脚本时请记得这一点。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 分层依赖检查（ENG-001）
        run: python3 tools/check_layering.py
      - name: 图标一致性检查（ENG-009 / UI-025）
        run: python3 tools/check_icons.py
      - name: 规格数据自检（UI-024 / DOC-005）
        run: python3 tools/check_spec.py
      # CI 只在 Linux 上跑测试，所以「在 CI 上全绿」不代表脚本能在 macOS 上跑。
      # 这一步专门拦 bash 4 内建与 GNU 工具扩展这两类「Linux 能跑、macOS 崩」的写法。
      - name: Shell 脚本可移植性检查（ENG-003 / PLAT-001）
        run: python3 tools/check_shell.py
      # Windows 宽字符 API 在 CI 里根本没被编译过（矩阵里只有 Ubuntu），
      # 而用错 ANSI 版 API 的后果是中文路径乱码——要等用户拿到才暴露。
      # 所以这里做静态检查。先跑自测：一个从不报错的护栏比没有护栏更糟。
      - name: Windows 宽字符 API 护栏自测（PLAT-007）
        run: python3 tools/check_winapi.py --self-test
      - name: Windows 宽字符 API 检查（PLAT-007）
        run: python3 tools/check_winapi.py

  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            qt: "5.15.2"
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          cache: true
      - name: 获取 LqRibbon 依赖
        run: |
          # LqRibbon 位于 MyClass 仓库；CI 中以只读方式取入同级目录。
          git clone --depth 1 https://github.com/LorenHan/MyClass.git ../MyClass
      - name: 构建主程序
        run: |
          mkdir -p ../build
          cd ../build
          qmake "$GITHUB_WORKSPACE/Code/LqCompare.pro"
          make -j"$(nproc)"
      - name: 运行测试套件
        run: bash Code/Tests/run-tests.sh
